function buildDefaultRoles() {
  return TEMPLATE.map((r, i) => ({
    id: `r-${Date.now()}-${i}`,
    title: r.title,
    person: r.person,
    items: { Persiapan: [...r.items.Persiapan], Akad: [...r.items.Akad], Resepsi: [...r.items.Resepsi], Closing: [...r.items.Closing] },
  }));
}
function emptyItems() { return { Persiapan: [], Akad: [], Resepsi: [], Closing: [] }; }
function roleLabel(role) { return role.person ? `${role.title} — ${role.person}` : role.title; }

function progressPct(role, progress) {
  let total = 0, done = 0;
  PHASES.forEach((phase) => {
    (role.items[phase] || []).forEach((text) => {
      total += 1;
      if (progress && progress[`${phase}|||${text}`]) done += 1;
    });
  });
  return { total, done, pct: total === 0 ? 0 : Math.round((done / total) * 100) };
}

function TapeBar({ pct, height = 10 }) {
  const color = pct >= 100 ? C.green : pct >= 50 ? C.amber : C.red;
  return (
    <div style={{ height, width: "100%", border: `1px solid ${C.lineStrong}`, position: "relative", overflow: "hidden",
      background: `repeating-linear-gradient(135deg,${C.line},${C.line} 4px,#EFE9DA 4px,#EFE9DA 8px)` }}>
      <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${pct}%`, background: color, transition: "width 300ms ease" }} />
    </div>
  );
}

function Header({ eyebrow, title, onBack }) {
  return (
    <div style={{ marginBottom: 20 }}>
      {onBack && (
        <button onClick={onBack} style={{ background: "none", border: "none", color: C.muted, fontSize: 13,
          fontFamily: "'IBM Plex Mono', monospace", cursor: "pointer", padding: 0, marginBottom: 14 }}>
          ← KEMBALI
        </button>
      )}
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.12em", color: C.amber, marginBottom: 4 }}>{eyebrow}</div>
      <h1 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 34, letterSpacing: "0.02em", color: C.ink, lineHeight: 1 }}>{title}</h1>
    </div>
  );
}

function Btn({ children, onClick, variant = "primary", style = {} }) {
  const base = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.06em", padding: "10px 16px",
    border: `1px solid ${C.ink}`, cursor: "pointer" };
  const variants = { primary: { background: C.ink, color: C.paper }, secondary: { background: "transparent", color: C.ink },
    ghost: { background: "transparent", color: C.muted, border: "1px solid transparent" } };
  return <button onClick={onClick} style={{ ...base, ...variants[variant], ...style }}>{children}</button>;
}

function PinGate({ eventName, onSubmit, onBack, error }) {
  const [val, setVal] = useState("");
  return (
    <div>
      <Header eyebrow={eventName} title="Masukkan PIN" onBack={onBack} />
      <input
        value={val}
        onChange={(e) => setVal(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && onSubmit(val)}
        type="password"
        inputMode="numeric"
        placeholder="PIN"
        autoFocus
        style={{ width: "100%", padding: 12, border: `1px solid ${C.lineStrong}`, background: C.card, fontSize: 16, marginBottom: 10, letterSpacing: "0.3em" }}
      />
      {error && <div style={{ color: C.red, fontSize: 12, marginBottom: 10, fontFamily: "'IBM Plex Mono', monospace" }}>PIN salah, coba lagi.</div>}
      <Btn onClick={() => onSubmit(val)}>MASUK</Btn>
    </div>
  );
}

      setEventsList(snap.docs.map((d) => ({ id: d.id, ...d.data() })));

    return unsub;

  }, [eventId]);

    if (!newEventName.trim() || !newTeamPin.trim() || !newLeaderPin.trim()) return;
    const newRef = db.collection("events").doc();
    newRef.set({ name: newEventName.trim(), eventPin: newTeamPin.trim(), leaderPin: newLeaderPin.trim(), roles: buildDefaultRoles(), progress: {} });

    setEventId(newRef.id);
    setVerifiedLeader(newRef.id);
    setScreen("lead-setup");

  const goPinGate = (id, level, target) => {
    setEventId(id);
    setPendingLevel(level);
    setPendingTarget(target);
    setPinError(false);
    setScreen("pin-gate");
  };

  const submitPin = (val) => {
    if (!live) return;
    const correct = pendingLevel === "team" ? live.eventPin : live.leaderPin;

      if (pendingLevel === "team") setVerifiedTeam(eventId);
      else setVerifiedLeader(eventId);

    ref().update({ roles: newRoles });

    const newRoles = live.roles.map((r) => (r.id === rId ? { ...r, ...patch } : r));

  };

      <Shell>
        <Header eyebrow="LEAD" title="Pilih event" onBack={() => setScreen("home")} />
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
          <input value={newEventName} onChange={(e) => setNewEventName(e.target.value)} placeholder="Nama event, mis. Nikahan Dinda & Raka"
            style={{ padding: 10, border: `1px solid ${C.lineStrong}`, background: C.card, fontSize: 14 }} />
          <div style={{ display: "flex", gap: 8 }}>
            <input value={newTeamPin} onChange={(e) => setNewTeamPin(e.target.value)} placeholder="PIN Tim (crew)"
              style={{ flex: 1, padding: 10, border: `1px solid ${C.lineStrong}`, background: C.card, fontSize: 14 }} />
            <input value={newLeaderPin} onChange={(e) => setNewLeaderPin(e.target.value)} placeholder="PIN Leader"
              style={{ flex: 1, padding: 10, border: `1px solid ${C.lineStrong}`, background: C.card, fontSize: 14 }} />
          </div>
          <Btn onClick={createEvent}>+ BUAT EVENT (isi template otomatis)</Btn>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {eventsList.length === 0 && <div style={{ color: C.muted, fontSize: 13 }}>Belum ada event.</div>}
          {eventsList.map((ev) => (
            <div key={ev.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.card, border: `1px solid ${C.line}`, padding: "12px 14px" }}>
              <span style={{ fontSize: 14, color: C.ink }}>{ev.name}</span>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn variant="secondary" style={{ fontSize: 11, padding: "6px 10px" }} onClick={() => { setEventId(ev.id); requireLeader("lead-setup"); }}>SETUP</Btn>
                <Btn style={{ fontSize: 11, padding: "6px 10px" }} onClick={() => { setEventId(ev.id); requireLeader("lead-dashboard"); }}>DASHBOARD</Btn>
              </div>
            </div>
          ))}
        </div>
      </Shell>
    );
  }

  if (screen === "crew-events") {
    return (
      <Shell>
        <Header eyebrow="CREW" title="Pilih event" onBack={() => setScreen("home")} />
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {eventsList.length === 0 && <div style={{ color: C.muted, fontSize: 13 }}>Belum ada event.</div>}
          {eventsList.map((ev) => (
            <div key={ev.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.card, border: `1px solid ${C.line}`, padding: "12px 14px" }}>
              <span style={{ fontSize: 14, color: C.ink }}>{ev.name}</span>
              <Btn style={{ fontSize: 11, padding: "6px 10px" }} onClick={() => goPinGate(ev.id, "team", "crew-role")}>PILIH</Btn>
            </div>
          ))}
        </div>
      </Shell>
    );
  }

  if (screen === "pin-gate") {
    return (
      <Shell>
        <PinGate
          eventName={live ? live.name : "..."}
          error={pinError}
          onSubmit={submitPin}
          onBack={() => setScreen(pendingLevel === "team" ? "crew-events" : "lead-events")}
        />
      </Shell>
    );
  }

  if (!live) return <Shell><div style={{ color: C.muted, fontSize: 13 }}>Memuat...</div></Shell>;

  if (screen === "lead-setup") {
    return (
      <Shell wide>
        <Header eyebrow={`EVENT — ${live.name}`} title="Setup jobdesk" onBack={() => setScreen("lead-events")} />
        <div style={{ marginBottom: 16 }}>
          <Btn onClick={() => setScreen("lead-dashboard")}>DASHBOARD →</Btn>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {(live.roles || []).map((role) => <RoleEditor key={role.id} role={role} onUpdate={(patch) => updateRole(role.id, patch)} onRemove={() => removeRole(role.id)} />)}
        </div>
        <div style={{ marginTop: 16 }}><Btn variant="secondary" onClick={addRole}>+ TAMBAH ROLE</Btn></div>
      </Shell>
    );
  }

  if (screen === "crew-role") {
    return (
      <Shell>
        <Header eyebrow={live.name} title="Kamu siapa?" onBack={() => setScreen("crew-events")} />
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {(live.roles || []).length === 0 && <div style={{ color: C.muted, fontSize: 13 }}>Role belum disetup oleh lead.</div>}
          {(live.roles || []).map((role) => (
            <button key={role.id} onClick={() => { setRoleId(role.id); setScreen("crew-checklist"); }}
              style={{ textAlign: "left", background: C.card, border: `1px solid ${C.line}`, padding: 14, cursor: "pointer" }}>
              <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: C.ink }}>{role.title}</div>
              {role.person && <div style={{ fontSize: 12, color: C.muted, fontFamily: "'IBM Plex Mono', monospace" }}>{role.person}</div>}
            </button>
          ))}
        </div>
      </Shell>
    );
  }

  if (screen === "crew-checklist") {
    const role = (live.roles || []).find((r) => r.id === roleId);
    if (!role) return <Shell><div>Role tidak ditemukan.</div></Shell>;
    const progress = (live.progress && live.progress[roleId]) || {};
    const stats = progressPct(role, progress);
    return (
      <Shell wide>
        <Header eyebrow={`${live.name} — ${roleLabel(role)}`} title="Checklist tugas" onBack={() => setScreen("crew-role")} />
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", color: C.muted, marginBottom: 4 }}>
            <span>PROGRESS</span><span>{stats.done}/{stats.total} — {stats.pct}%</span>
          </div>
          <TapeBar pct={stats.pct} height={14} />
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          {PHASES.map((phase) => {
            const items = role.items[phase] || [];
            if (items.length === 0) return null;
            return (
              <div key={phase}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, background: C.ink, color: C.paper, padding: "3px 8px" }}>{PHASE_CODE[phase]}</span>
                  <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: C.ink }}>{phase}</span>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6, paddingLeft: 4, borderLeft: `2px solid ${C.line}` }}>
                  {items.map((text) => {
                    const checked = !!progress[`${phase}|||${text}`];
                    return (
                      <button key={text} onClick={() => toggleItem(phase, text)}
                        style={{ display: "flex", alignItems: "center", gap: 10, textAlign: "left", marginLeft: 10, cursor: "pointer",
                          background: checked ? C.greenBg : C.card, border: `1px solid ${checked ? C.green : C.line}`, padding: "10px 12px" }}>
                        <span style={{ width: 18, height: 18, border: `1.5px solid ${checked ? C.green : C.lineStrong}`, background: checked ? C.green : "transparent",
                          display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: C.card, fontSize: 12 }}>{checked ? "✓" : ""}</span>
                        <span style={{ fontSize: 14, color: checked ? C.green : C.ink, textDecoration: checked ? "line-through" : "none" }}>{text}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </Shell>
    );
  }

  if (screen === "lead-dashboard") {
    const rolesWithStats = (live.roles || []).map((r) => ({ role: r, stats: progressPct(r, (live.progress && live.progress[r.id]) || {}) })).sort((a, b) => a.stats.pct - b.stats.pct);
    const overallTotal = rolesWithStats.reduce((s, r) => s + r.stats.total, 0);
    const overallDone = rolesWithStats.reduce((s, r) => s + r.stats.done, 0);
    const overallPct = overallTotal === 0 ? 0 : Math.round((overallDone / overallTotal) * 100);
    return (
      <Shell wide>
        <Header eyebrow={live.name} title="Dashboard lead" onBack={() => setScreen("lead-events")} />
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
          <div style={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", color: C.muted }}>SEMUA ROLE — {overallDone}/{overallTotal} ITEM ({overallPct}%)</div>
          <Btn variant="secondary" style={{ fontSize: 11, padding: "6px 10px" }} onClick={() => setScreen("lead-setup")}>EDIT SETUP</Btn>
        </div>
        <div style={{ marginBottom: 22 }}><TapeBar pct={overallPct} height={14} /></div>
        <div style={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace", color: C.muted, marginBottom: 10 }}>DIURUTKAN DARI PALING TERTINGGAL — LIVE</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {rolesWithStats.length === 0 && <div style={{ color: C.muted, fontSize: 13 }}>Belum ada role.</div>}
          {rolesWithStats.map(({ role, stats }) => <RoleCard key={role.id} role={role} stats={stats} progress={(live.progress && live.progress[role.id]) || {}} />)}
        </div>
      </Shell>
    );
  }

  return <Shell><div>...</div></Shell>;
}

function RoleEditor({ role, onUpdate, onRemove }) {
  const [open, setOpen] = useState(true);
  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: 12, borderBottom: open ? `1px solid ${C.line}` : "none" }}>
        <button onClick={() => setOpen(!open)} style={{ background: "none", border: "none", cursor: "pointer" }}>{open ? "▾" : "▸"}</button>
        <input defaultValue={role.title} onBlur={(e) => onUpdate({ title: e.target.value })} placeholder="Jabatan / role"
          style={{ flex: 1, fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, border: "none", background: "transparent", color: C.ink, padding: 4 }} />
        <input defaultValue={role.person} onBlur={(e) => onUpdate({ person: e.target.value })} placeholder="Nama petugas"
          style={{ width: 140, fontSize: 13, border: `1px solid ${C.line}`, background: C.paper, color: C.ink, padding: "6px 8px" }} />
        <button onClick={onRemove} style={{ background: "none", border: "none", cursor: "pointer", color: C.red }}>✕</button>
      </div>
      {open && (
        <div style={{ padding: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {PHASES.map((phase) => (
            <div key={phase}>
              <div style={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace", color: C.amber, marginBottom: 4 }}>{PHASE_CODE[phase]} — {phase}</div>
              <textarea defaultValue={(role.items[phase] || []).join("\n")}
                onBlur={(e) => onUpdate({ items: { ...role.items, [phase]: e.target.value.split("\n").map((s) => s.trim()).filter(Boolean) } })}
                placeholder="1 tugas per baris" rows={4} style={{ width: "100%", border: `1px solid ${C.line}`, padding: 8, fontSize: 13, resize: "vertical", background: C.paper }} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RoleCard({ role, stats, progress }) {
  const [open, setOpen] = useState(false);
  const color = stats.pct >= 100 ? C.green : stats.pct >= 50 ? C.amber : C.red;
  const bg = stats.pct >= 100 ? C.greenBg : stats.pct >= 50 ? C.amberBg : C.redBg;
  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}` }}>
      <button onClick={() => setOpen(!open)} style={{ width: "100%", display: "flex", justifyContent: "space-between", padding: 12, background: "none", border: "none", cursor: "pointer" }}>
        <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 18, color: C.ink }}>{stats.pct < 50 ? "⚠ " : ""}{roleLabelInline(role)}</span>
        <span style={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", color, background: bg, padding: "2px 8px" }}>{stats.done}/{stats.total} · {stats.pct}%</span>
      </button>
      <div style={{ padding: "0 12px 4px" }}><TapeBar pct={stats.pct} height={6} /></div>
      {open && (
        <div style={{ padding: 12, display: "flex", flexDirection: "column", gap: 10 }}>
          {PHASES.map((phase) => {
            const items = role.items[phase] || [];
            if (items.length === 0) return null;
            return (
              <div key={phase}>
                <div style={{ fontSize: 10, fontFamily: "'IBM Plex Mono', monospace", color: C.muted, marginBottom: 4 }}>{PHASE_CODE[phase]}</div>
                {items.map((text) => {
                  const checked = !!progress[`${phase}|||${text}`];
                  return (
                    <div key={text} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                      <span style={{ width: 12, height: 12, border: `1px solid ${checked ? C.green : C.lineStrong}`, background: checked ? C.green : "transparent", flexShrink: 0 }} />
                      <span style={{ color: checked ? C.green : C.ink, textDecoration: checked ? "line-through" : "none" }}>{text}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
function roleLabelInline(role) { return role.person ? `${role.title} — ${role.person}` : role.title; }

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
